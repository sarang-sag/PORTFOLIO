<!-- High-End Branded Preloader Overlay -->
@if (isLoading()) {
  <div class="app-preloader-overlay" [class.fade-out]="isFadingOut()">
    <div class="preloader-card">
      <div class="preloader-logo">
        <span class="code">&lt;</span>
        <span class="name">Sarang</span>
        <span class="dot">.V</span>
        <span class="code"> /&gt;</span>
      </div>
      <div class="spinner-ring">
        <div class="spinner-core"></div>
      </div>
      <div class="preloader-status">
        <span class="status-pulse"></span>
        <span>Loading Portfolio...</span>
      </div>
    </div>
  </div>
}

<main class="portfolio-app-root">
  <!-- 1. Sticky Navigation Bar -->
  <app-navbar></app-navbar>

  <!-- 2. Hero Section -->
  <app-hero></app-hero>

  <!-- 3. About Me Section -->
  <app-about></app-about>

  <!-- 4. Professional Experience Timeline Section -->
  <app-experience></app-experience>

  <!-- 5. Skills & Tech Stack Section -->
  <app-skills></app-skills>

  <!-- 6. Featured Projects Showcase Section -->
  <app-projects></app-projects>

  <!-- 7. What I Do / Core Expertise Section -->
  <app-expertise></app-expertise>

  <!-- 8. Development Approach Methodology Section -->
  <app-approach></app-approach>

  <!-- 9. Contact Section & Form -->
  <app-contact></app-contact>

  <!-- 10. Footer Section -->
  <app-footer></app-footer>
</main>
